[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lookup-cli"
version = "0.1.0"
description = "Unified identity/asset lookup CLI across Okta, Jira, Jamf, ABM, allwhere, and future services"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "freezegun>=1.5",
]

[project.scripts]
lookup-cli = "lookup_cli.cli:app"

# Core ships one built-in plugin (echo) used to prove the framework works
# in Stage 0. Real service plugins register under this same entry-point
# group from their own packages (see plugins/*/pyproject.toml).
[project.entry-points."lookup_cli.plugins"]
echo = "lookup_cli.plugins.echo_builtin:EchoPlugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "plugin_framework: Stage 0 - plugin registry/discovery",
    "cache: Stage 1 - cache and data model",
    "okta: Stage 2 - Okta connector",
    "jira: Stage 3 - Jira connector",
    "jamf: Stage 4 - Jamf connector",
    "abm: Stage 5 - ABM connector",
    "allwhere: Stage 6 - allwhere connector",
    "cli: Stage 7 - aggregation CLI",
]
