[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lookup-cli-okta-plugin"
version = "0.1.0"
description = "Okta account-status connector for lookup-cli."
requires-python = ">=3.11"
dependencies = ["lookup-cli", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.2", "respx>=0.21"]

# Registered under the same entry-point group core already scans, so
# nothing in src/lookup_cli/ changed to add this connector.
[project.entry-points."lookup_cli.plugins"]
okta = "okta_plugin.plugin:OktaPlugin"

[tool.setuptools.packages.find]
where = ["."]
include = ["okta_plugin*"]
